[project]
name = "meshgarden"
version = "1.12.3"
description = "Meshgarden - a MeshCore-first LoRa BBS with Meshtastic support"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
    "meshtastic==2.7.11",
    "prometheus-client==0.26.0",
    "astral==3.2",
]

[project.optional-dependencies]
# Not required for a Meshtastic-only install, and never imported by one
# either: meshgarden/meshcore_client.py defers `import meshcore` until a
# MeshCore transport is actually constructed (see MeshCoreLibraryMissing),
# so `mgarden` never loads this package or its dependencies unless
# [radio] transport = "meshcore" is configured. Only install this extra
# if you actually run that transport.
meshcore = ["meshcore>=2.3.11,<3"]

[project.scripts]
mgarden = "meshgarden.main:main"
# Deprecated alias; removal deferred to the dual-radio epic's 2.0.0
# release alongside the database split (scope-decisions.md section 5).
meshtastic-observatory = "meshgarden.main:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshgarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware'"
markers = ["hardware: requires a real Meshtastic radio attached over USB"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The brief mandates this DDL and test assertion verbatim, including inline
# SQL comments that exceed the project line-length and a Yoda-style assert.
"meshgarden/database.py" = ["E501"]
"tests/test_database.py" = ["SIM300"]
# The brief mandates `datetime.strptime(...).replace(tzinfo=timezone.utc)` verbatim.
"meshgarden/retention.py" = ["UP017"]
# The brief mandates this test file's imports and one-line statements verbatim.
"tests/test_retention.py" = ["E401", "E702", "F401", "I001"]
# The brief mandates this test file's `import pathlib, tomllib` and inline
# `from ... import parse_config, ConfigError` verbatim.
"tests/test_packaging.py" = ["E401", "I001"]
